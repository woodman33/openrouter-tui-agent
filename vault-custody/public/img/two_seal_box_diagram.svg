<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#E9E5DD"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#221F1B">The two-seal box — nothing printed on any card</text>

  <!-- closed box -->
  <g transform="translate(60,110)">
    <text x="0" y="0" font-size="16" fill="#5C564E">1  Sealed at the counter (or the factory)</text>
    <!-- box body -->
    <polygon points="40,90 300,90 300,300 40,300" fill="#1c2f5a"/>
    <polygon points="300,90 360,50 360,260 300,300" fill="#122246"/>
    <polygon points="40,90 100,50 360,50 300,90" fill="#2a4380"/>
    <!-- shrink sheen -->
    <polygon points="40,90 300,90 300,300 40,300" fill="#ffffff" opacity="0.10"/>
    <polygon points="40,90 100,50 360,50 300,90" fill="#ffffff" opacity="0.18"/>
    <!-- lid seam -->
    <line x1="40" y1="120" x2="300" y2="120" stroke="#0b1730" stroke-width="2"/>
    <!-- TagTamper label across the seam -->
    <rect x="130" y="96" width="80" height="48" rx="6" fill="#F7F3EA" stroke="#A98A5B" stroke-width="2"/>
    <path d="M140 104 h60 v32 h-60 z" fill="none" stroke="#A98A5B" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="170" y="126" font-size="11" text-anchor="middle" fill="#221F1B">TagTamper</text>
    <!-- the loop -->
    <path d="M136 100 q-8 20 0 40" fill="none" stroke="#C0392B" stroke-width="2"/>
    <text x="42" y="330" font-size="13" fill="#221F1B">Sticker across the lid seam. A hair-thin</text>
    <text x="42" y="348" font-size="13" fill="#221F1B">loop (red) runs through it. Tap → "sealed".</text>
    <!-- inner reveal tag (hidden) -->
    <circle cx="200" cy="72" r="14" fill="#5B3A21" stroke="#A98A5B" stroke-width="2" opacity="0.35"/>
    <text x="200" y="40" font-size="12" text-anchor="middle" fill="#5C564E">424 DNA under the lid (unreachable)</text>
  </g>

  <!-- arrow -->
  <path d="M470 300 h90" stroke="#5C564E" stroke-width="3" fill="none"/>
  <polygon points="560,300 546,292 546,308" fill="#5C564E"/>
  <text x="515" y="285" font-size="13" text-anchor="middle" fill="#5C564E">opened</text>

  <!-- opened box -->
  <g transform="translate(600,110)">
    <text x="0" y="0" font-size="16" fill="#5C564E">2  Opened by the buyer</text>
    <polygon points="40,90 300,90 300,300 40,300" fill="#1c2f5a"/>
    <polygon points="300,90 360,50 360,260 300,300" fill="#122246"/>
    <!-- lid raised -->
    <polygon points="40,90 300,90 320,20 60,20" fill="#2a4380"/>
    <polygon points="40,90 300,90 300,300 40,300" fill="#ffffff" opacity="0.10"/>
    <!-- torn label halves -->
    <rect x="130" y="60" width="80" height="24" rx="4" fill="#F7F3EA" stroke="#A98A5B" stroke-width="2" transform="rotate(-14 170 72)"/>
    <rect x="130" y="96" width="80" height="24" rx="4" fill="#F7F3EA" stroke="#A98A5B" stroke-width="2"/>
    <path d="M136 100 q-6 8 0 16" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M134 62 q-6 8 0 14" fill="none" stroke="#C0392B" stroke-width="2" transform="rotate(-14 170 72)"/>
    <text x="255" y="85" font-size="12" fill="#C0392B">loop broken → stored forever</text>
    <!-- reveal tag now visible on the inside of the lid -->
    <circle cx="180" cy="55" r="14" fill="#5B3A21" stroke="#A98A5B" stroke-width="2"/>
    <text x="180" y="59" font-size="9" text-anchor="middle" fill="#F7F3EA">424</text>
    <text x="42" y="330" font-size="13" fill="#221F1B">Tap the seal → "opened at tap #4, Sep 14".</text>
    <text x="42" y="348" font-size="13" fill="#221F1B">Tap the inside tag → signed reveal, timestamped.</text>
  </g>

  <!-- what each tap proves -->
  <g transform="translate(60,480)">
    <rect x="0" y="0" width="1080" height="110" rx="10" fill="#F4F2ED" stroke="#D3CEC4"/>
    <text x="24" y="32" font-size="14" font-weight="600" fill="#221F1B">What each piece proves</text>
    <text x="24" y="58" font-size="13" fill="#221F1B">Outer TagTamper seal — has this seam been opened since it was sealed? (state, remembered by the chip; no battery, no clock, read at the next tap)</text>
    <text x="24" y="80" font-size="13" fill="#221F1B">Inner 424 DNA reveal — was this physical box open in someone's hands at this moment? (signed, un-copyable; timestamp = the tap)</text>
    <text x="24" y="102" font-size="13" fill="#221F1B">Ledger — what was sealed, by whom, when, with seal photos and a contents hash committed before sale. The cards themselves stay untouched.</text>
  </g>
</svg>
