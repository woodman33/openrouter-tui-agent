name: CI

on:
  push:
    branches: [ main, master, feature/hermes-gateway-mvp ]
  pull_request:
    branches: [ main, master, feature/hermes-gateway-mvp ]

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install ffmpeg (clip runner E2E)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install OpenTimelineIO 0.18.1 (otioconvert, pinned)
        run: python3 -m pip install --user opentimelineio==0.18.1 && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Type gate (tsc)
        run: npx tsc --noEmit

      - name: Type gate (tsgo / TS7 native)
        run: npm run typecheck:native

      - name: Test gate (vitest)
        run: npx vitest run
