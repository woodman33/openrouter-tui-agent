<!doctype html><html><head><meta charset="utf-8"><title>TIMMY /chat</title>
<style>
body{margin:0;background:#070C14;color:#D9E4F5;font:14px/1.5 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;height:100vh}
header{padding:6px 12px;color:#46587A;border-bottom:1px solid #20304C}
header b{color:#37D2FF}
main{display:flex;flex:1;min-height:0}
#left{flex:62;overflow-y:auto;padding:12px 16px}
#right{flex:38;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.user{color:#37D2FF;font-weight:700;margin:10px 0 4px}
.user:before{content:"▸ "}
.assistant{margin:0 0 10px}
.assistant pre{color:#8CA0BE}
.assistant a{color:#37D2FF}
.assistant h1,.assistant h2,.assistant h3{color:#D9E4F5}
.sealed{color:#46587A}.sealed b{color:#3BE08C;font-weight:600}
.drop{margin-bottom:8px}.drop .s{color:#8CA0BE}.drop .h{color:#3BE08C}.drop .m{color:#46587A}
#empty{color:#46587A;font-weight:400}
</style></head><body>
<header><b>PROMPT</b> ─ PLAN ─ LANES ─ RECEIPTS ─ PROOF · mirror of the TUI counterflow chat · full inspection at /</header>
<main><div id="left"><h1 id="empty">no conversation yet — type a mission in the TUI</h1></div><div id="right"></div></main>
<script type="module">
import React from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import { Streamdown } from 'https://esm.sh/streamdown?deps=react@18.3.1';
var h = React.createElement;
var left = document.getElementById('left');
var right = document.getElementById('right');
function Left(props) {
  var turns = props.turns;
  if (!turns.length) return h('h1', { id: 'empty' }, 'no conversation yet — type a mission in the TUI');
  return h('div', null, turns.map(function (t, i) {
    if (t.role === 'user') return h('div', { className: 'user', key: i }, t.content);
    return h('div', { className: 'assistant', key: i },
      h(Streamdown, { mode: 'static' }, t.content),
      t.seal ? h('div', { className: 'sealed' }, '● sealed ', h('b', null, t.seal)) : null);
  }));
}
var root = createRoot(left);
var turns = [];
var drops = [];
function drawLeft() { root.render(h(Left, { turns: turns })); }
function drawRight() {
  right.innerHTML = '';
  drops.slice(-9).forEach(function (d) {
    var e = document.createElement('div');
    e.className = 'drop';
    var s = document.createElement('div'); s.className = 's'; s.textContent = d.subject;
    var hh = document.createElement('div'); hh.className = 'h'; hh.textContent = d.hash;
    var m = document.createElement('div'); m.className = 'm'; m.textContent = '· ' + d.kind + ' · ' + d.ts;
    e.appendChild(s); e.appendChild(hh); e.appendChild(m);
    right.appendChild(e);
  });
}
var es = new EventSource('/chat/events');
es.onmessage = function (ev) {
  var o = JSON.parse(ev.data);
  if (o.t === 'turns') { turns = o.turns; drawLeft(); }
  else if (o.t === 'receipt') { drops.push(o); drawRight(); }
};
</script></body></html>
